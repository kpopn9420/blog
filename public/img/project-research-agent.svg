<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Research Paper Assistant Agent workflow</title>
  <desc id="desc">A LangGraph research assistant routes natural language requests to RAG search, PDF upload, arXiv search, and paper comparison tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a42"/>
      <stop offset="0.52" stop-color="#4f46a5"/>
      <stop offset="1" stop-color="#0f9aae"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f8cff"/>
      <stop offset="1" stop-color="#53d8e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050816" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88ebf2"/>
    </marker>
  </defs>

  <rect width="1200" height="750" rx="42" fill="url(#background)"/>
  <circle cx="1060" cy="100" r="250" fill="#70e5ef" opacity="0.08"/>
  <circle cx="130" cy="690" r="310" fill="#b7a5ff" opacity="0.08"/>

  <g fill="none" stroke="#88ebf2" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.82">
    <path d="M 245 375 H 430"/>
    <path d="M 700 375 C 790 375 770 175 850 175"/>
    <path d="M 700 375 C 790 375 770 310 850 310"/>
    <path d="M 700 375 C 790 375 770 445 850 445"/>
    <path d="M 700 375 C 790 375 770 580 850 580"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="290" width="175" height="170" rx="34" fill="#ffffff" fill-opacity="0.96"/>
    <rect x="430" y="270" width="270" height="210" rx="42" fill="#ffffff" fill-opacity="0.98"/>
    <rect x="850" y="115" width="280" height="120" rx="28" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="850" y="250" width="280" height="120" rx="28" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="850" y="385" width="280" height="120" rx="28" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="850" y="520" width="280" height="120" rx="28" fill="#ffffff" fill-opacity="0.94"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#171a42">
    <text x="157" y="355" text-anchor="middle" font-size="24" font-weight="700">Natural</text>
    <text x="157" y="387" text-anchor="middle" font-size="24" font-weight="700">Language</text>
    <text x="157" y="422" text-anchor="middle" font-size="17" fill="#666985">QUERY</text>

    <circle cx="565" cy="345" r="48" fill="url(#accent)"/>
    <path d="M542 346h46M565 323v46" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <text x="565" y="422" text-anchor="middle" font-size="30" font-weight="800">LangGraph Agent</text>
    <text x="565" y="450" text-anchor="middle" font-size="17" fill="#666985">DYNAMIC TOOL ROUTING</text>

    <text x="895" y="163" font-size="24" font-weight="800">RAG Search</text>
    <text x="895" y="195" font-size="17" fill="#666985">ChromaDB + SQLite</text>

    <text x="895" y="298" font-size="24" font-weight="800">PDF Upload</text>
    <text x="895" y="330" font-size="17" fill="#666985">Parse + vectorize papers</text>

    <text x="895" y="433" font-size="24" font-weight="800">arXiv Search</text>
    <text x="895" y="465" font-size="17" fill="#666985">Retrieve recent research</text>

    <text x="895" y="568" font-size="24" font-weight="800">Paper Compare</text>
    <text x="895" y="600" font-size="17" fill="#666985">Structured analysis report</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#ffffff">
    <text x="70" y="85" font-size="21" font-weight="700" letter-spacing="3" opacity="0.76">LLM COURSE PROJECT</text>
    <text x="70" y="135" font-size="42" font-weight="800">Research Paper Assistant</text>
    <rect x="70" y="170" width="330" height="7" rx="4" fill="url(#accent)"/>
    <text x="70" y="690" font-size="20" font-weight="600" opacity="0.86">RAG · ReAct · LangGraph · Streamlit</text>
  </g>
</svg>
